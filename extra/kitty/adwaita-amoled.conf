# ── Cursor ────────────────────────────────────────────────────────────────────
# @accent blue
cursor #8ab4f8
# pure black behind cursor glyph
cursor_text_color #000000

# ── Mouse / URLs ───────────────────────────────────────────────────────────────
# link color
url_color #01c1f1

# ── Tabs ──────────────────────────────────────────────────────────────────────
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_bar_margin_width    0.0
tab_title_template      "{bell_symbol}{activity_symbol}{index}: {title}"
active_tab_font_style   bold
inactive_tab_font_style normal

active_tab_foreground   #000000
# @accent blue
active_tab_background   #8ab4f8
# disabled/backdrop text
inactive_tab_foreground #c0c0c0
# surface_hover
inactive_tab_background #1a1a1a
tab_bar_background      #000000

# ── Core palette ──────────────────────────────────────────────────────────────
background            #000000
foreground            #ffffff

# Blue-tinted selection with white text
selection_foreground  #ffffff
selection_background  #1a2d4a

# ── Normal colors ─────────────────────────────────────────────────────────────
# pure black (terminal fill)
color0  #000000
# error — softened from #ff0000
color1  #ff7b7b
# success
color2  #0aeea0
# warning
color3  #f1ac00
# @accent blue
color4  #8ab4f8
# readable syntax magenta
color5  #d49bea
# link/cyan
color6  #01c1f1
# primary fg
color7  #ffffff

# ── Bright colors (bold text) ─────────────────────────────────────────────────
# readable bright-black text
color8  #a0a0a0
# brighter error
color9  #ff9a9a
# brighter success
color10 #4affc4
# brighter warning
color11 #ffcc44
# @accent_hover
color12 #aecbfa
# brighter magenta
color13 #e599ff
# bright cyan
color14 #44ddff
# backdrop text
color15 #fafafa

# ── Faint/dim ANSI text ────────────────────────────────────────────────────────
# Kitty dims the normal palette through opacity, rather than a dim0–dim7 palette.
dim_opacity 0.75
