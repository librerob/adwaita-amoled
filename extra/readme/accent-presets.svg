<svg xmlns="http://www.w3.org/2000/svg" width="960" height="288" viewBox="0 0 960 288" role="img" aria-labelledby="title desc">
  <title id="title">Adwaita AMOLED accent presets</title>
  <desc id="desc">Actual palette samples, not application screenshots. Each card shows light accent text and a darker filled button with a white label. Blue is the default.</desc>
