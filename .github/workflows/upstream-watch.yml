name: Upstream watch

on:
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/upstream-watch.yml'
      - 'maintenance/upstream-watch.json'
      - 'tools/upstream_watch.py'
      - 'tests/test_upstream_watch.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-watch.yml'
      - 'maintenance/upstream-watch.json'
      - 'tools/upstream_watch.py'
      - 'tests/test_upstream_watch.py'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test version filtering, pagination and failure reporting
        run: python3 tests/test_upstream_watch.py
      - name: Check upstream versions and write review report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/upstream_watch.py --output '${{ runner.temp }}/upstream-watch'
      - name: Save upstream review report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-review-report
          path: ${{ runner.temp }}/upstream-watch
          retention-days: 90
          if-no-files-found: warn
