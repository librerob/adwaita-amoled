name: Release verification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave blank for the latest stable release)'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/release-verification.yml'
      - 'tools/verify_release.py'
      - 'tools/package.py'
      - 'tests/test_release_verification.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-verification.yml'
      - 'tools/verify_release.py'
      - 'tools/package.py'
      - 'tests/test_release_verification.py'

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test archive integrity and unsafe-input rejection
        run: python3 tests/test_release_verification.py
      - name: Verify published archive against its tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 tools/verify_release.py --tag "$RELEASE_TAG" --output '${{ runner.temp }}/release-verification'
      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-report
          path: ${{ runner.temp }}/release-verification
          retention-days: 90
          if-no-files-found: warn
