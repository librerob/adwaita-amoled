name: Theme checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev rsync shellcheck zsh kitty neovim \
            python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0 gir1.2-adw-1 \
            libmetacity3 xvfb xauth
      - name: Check shell syntax
        run: |
          shellcheck build.sh gnome-shell/build.sh tests/gnome-shell/session.sh
          zsh -n extra/zsh/.zshrc
      - name: Check resources, installation and extras
        run: python3 tests/test_theme.py
      - name: Check native parsing and rendering
        env:
          THEME_TEST_OUTPUT: ${{ runner.temp }}/theme-test-output
        run: xvfb-run -a -s '-screen 0 1600x1200x24' python3 tests/test_runtime.py
      - name: Upload rendering evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: theme-rendering
          path: ${{ runner.temp }}/theme-test-output
          if-no-files-found: ignore

  modern-native:
    runs-on: ubuntu-24.04
    container: ubuntu:26.10
    steps:
      - name: Install modern native consumers
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0 \
            gir1.2-adw-1 libmetacity3 xvfb xauth
      - uses: actions/checkout@v7
      - name: Check modern native parsing, rendering and text colors
        env:
          THEME_TEST_OUTPUT: ${{ runner.temp }}/theme-test-output-modern
        run: xvfb-run -a -s '-screen 0 1600x1200x24' python3 tests/test_runtime.py
      - name: Upload modern rendering evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: theme-rendering-modern
          path: ${{ runner.temp }}/theme-test-output-modern
          if-no-files-found: ignore

  gnome-shell:
    runs-on: ubuntu-24.04
    container: ubuntu:26.10
    steps:
      - name: Install native GNOME Shell test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates gnome-shell gnome-shell-extension-user-theme \
            mutter-51-tests python3-dbusmock python3-dbus sassc pipewire wireplumber
      - uses: actions/checkout@v7
      - name: Check Shell source, reproducibility and native Wayland rendering
        env:
          THEME_TEST_OUTPUT: ${{ runner.temp }}/theme-test-output-shell
        run: python3 tests/test_shell.py
      - name: Upload Shell rendering evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gnome-shell-rendering
          path: ${{ runner.temp }}/theme-test-output-shell
          if-no-files-found: ignore
