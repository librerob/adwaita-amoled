name: Theme checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev sassc rsync shellcheck zsh kitty neovim vim-airline \
            python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 gir1.2-gtk-4.0 gir1.2-adw-1 \
            libmetacity3 xvfb xauth bat rofi flatpak xfconf libxfconf-0-3 dbus-x11 gsettings-desktop-schemas librsvg2-bin python3-pyqt5 python3-pyqt6 \
            libgtk2.0-0t64 gtk2-engines-murrine xapps-common
      - name: Check shell syntax
        run: |
          shellcheck install.sh setup-menu.sh build.sh gnome-shell/build.sh tests/gnome-shell/session.sh tests/gnome-shell/session46.sh
          zsh -n extra/zsh/.zshrc
      - name: Check resources, installation and extras
        run: |
          python3 tools/generate_palette.py --check
          python3 tools/build_accents.py --check
          python3 tests/test_palette.py
          python3 tests/test_accents.py
          python3 tests/test_runtime_package.py
          python3 tests/test_guided_installer.py GuidedInstallerTests
          python3 tests/test_installer.py
          python3 tests/test_installer_failures.py
          python3 tests/test_installer_preservation.py
          python3 tests/test_flatpak_installer.py
          python3 tests/test_manual_installation.py
          python3 tests/test_theme.py
          python3 tests/test_readability.py
      - name: Check root-owned shared installation in temporary staging roots
        run: sudo --preserve-env=GITHUB_ACTIONS xvfb-run -a python3 tests/test_system_installer.py
      - name: Check subtle decoration and visible GTK input edges
        env:
          THEME_TEST_OUTPUT: ${{ runner.temp }}/theme-test-output/borders
        run: xvfb-run -a python3 tests/test_borders.py
      - name: Check GNOME, Budgie and Xfce preference activation
        run: dbus-run-session -- python3 tests/test_install_settings.py DesktopSettingTests.test_gnome_and_budgie_activation DesktopSettingTests.test_xfce_activation DarkAppearanceTests
      - name: Check Bash-installed native applications
        run: xvfb-run -a -s '-screen 0 1600x1200x24' python3 tests/test_install_consumers.py
      - name: Check native parsing and rendering
        env:
          THEME_TEST_OUTPUT: ${{ runner.temp }}/theme-test-output
        run: xvfb-run -a -s '-screen 0 1600x1200x24' python3 tests/test_runtime.py
      - name: Check GTK2, Qt palettes, bat, Rofi and SVG rendering
        env:
          THEME_TEST_OUTPUT: ${{ runner.temp }}/theme-test-output-consumers
        run: xvfb-run -a python3 tests/test_consumers.py
      - name: Check every preset in GTK, Qt and application extras
        run: |
          xvfb-run -a -s '-screen 0 1600x1200x24' python3 tests/accent_native.py gtk '${{ runner.temp }}/theme-test-output/accents-gtk'
          xvfb-run -a python3 tests/accent_native.py qt '${{ runner.temp }}/theme-test-output/accents-qt'
          xvfb-run -a python3 tests/accent_native.py extras '${{ runner.temp }}/theme-test-output/accents-extras'
          xvfb-run -a python3 tests/accent_native.py edges '${{ runner.temp }}/theme-test-output/accents-edges'
      - name: Upload additional consumer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extra-consumer-rendering
          path: ${{ runner.temp }}/theme-test-output-consumers
          if-no-files-found: ignore
      - name: Upload rendering evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: theme-rendering
          path: ${{ runner.temp }}/theme-test-output
          if-no-files-found: ignore

  modern-native:
    runs-on: ubuntu-24.04
    container: ubuntu:26.10
    steps:
      - name: Install modern native consumers
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 gir1.2-gtk-4.0 \
            gir1.2-adw-1 libmetacity3 xvfb xauth libgtk2.0-0t64 gtk2-engines-murrine \
            libglib2.0-bin gsettings-desktop-schemas xapps-common
      - uses: actions/checkout@v7
      - name: Check guided administrator preview in isolated system paths
        run: python3 tests/test_guided_installer.py SystemMenuTests
      - name: Check automatic app dark appearance with real settings backends
        run: python3 tests/test_install_settings.py DarkAppearanceTests
      - name: Check native GTK2 discovery and automatic modern GTK4 links
        run: xvfb-run -a python3 tests/test_install_consumers.py InstalledConsumerTests.test_native_gtk2_discovers_default_user_installation InstalledConsumerTests.test_native_gtk4_automatic_loading_and_removal
      - name: Check modern native parsing, rendering and text colors
        env:
          THEME_TEST_OUTPUT: ${{ runner.temp }}/theme-test-output-modern
        run: xvfb-run -a -s '-screen 0 1600x1200x24' python3 tests/test_runtime.py
      - name: Check modern GTK decorative and identifying edges
        env:
          THEME_TEST_OUTPUT: ${{ runner.temp }}/theme-test-output-modern/borders
        run: xvfb-run -a python3 tests/test_borders.py BorderTests.test_gtk4_decorative_borders_and_input_edges
      - name: Check every preset with modern GTK4 and libadwaita
        run: |
          xvfb-run -a -s '-screen 0 1600x1200x24' python3 tests/accent_native.py gtk '${{ runner.temp }}/theme-test-output-modern/accents'
          xvfb-run -a python3 tests/accent_native.py edges '${{ runner.temp }}/theme-test-output-modern/accents-edges'
      - name: Upload modern rendering evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: theme-rendering-modern
          path: ${{ runner.temp }}/theme-test-output-modern
          if-no-files-found: ignore

  gnome-shell:
    runs-on: ubuntu-24.04
    container: ubuntu:26.10
    steps:
      - name: Install native GNOME Shell test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates gnome-shell gnome-shell-extension-user-theme \
            mutter-51-tests python3-dbusmock python3-dbus sassc pipewire wireplumber
      - uses: actions/checkout@v7
      - name: Check Shell source, reproducibility and native Wayland rendering
        env:
          THEME_TEST_OUTPUT: ${{ runner.temp }}/theme-test-output-shell
        run: python3 tests/test_shell.py
      - name: Check all eight fixed Shell accents against every GNOME system accent
        run: python3 tests/accent_native.py shell51 '${{ runner.temp }}/theme-test-output-shell/accents'
      - name: Upload Shell rendering evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gnome-shell-rendering
          path: ${{ runner.temp }}/theme-test-output-shell
          if-no-files-found: ignore

  gnome-shell-46:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Install native GNOME 46 Wayland test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates gnome-shell gnome-shell-extensions mutter-14-tests \
            python3-dbusmock python3-dbus python3-gi gir1.2-gdkpixbuf-2.0 sassc pipewire wireplumber librsvg2-common librsvg2-bin
      - uses: actions/checkout@v7
      - name: Check GNOME 46 source and actual pointer interactions
        env:
          THEME_TEST_OUTPUT: ${{ runner.temp }}/theme-test-output-shell46
        run: python3 tests/test_shell46.py
      - name: Check every preset with native GNOME 46 interactions
        run: python3 tests/accent_native.py shell46 '${{ runner.temp }}/theme-test-output-shell46/accents'
      - name: Upload GNOME 46 interaction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gnome-shell-46-interactions
          path: ${{ runner.temp }}/theme-test-output-shell46
          if-no-files-found: ignore

  cinnamon:
    runs-on: ubuntu-24.04
    container: ubuntu:26.10
    steps:
      - name: Install isolated Cinnamon test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates cinnamon cinnamon-session dbus-x11 \
            python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 \
            xvfb xauth libgl1-mesa-dri
      - uses: actions/checkout@v7
      - name: Check Cinnamon preference activation
        run: python3 tests/test_install_settings.py DesktopSettingTests.test_cinnamon_activation
      - name: Check native Cinnamon colors and task overlays
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork --nopidfile
          xvfb-run -a -s '-screen 0 1600x1200x24 +extension GLX +render -noreset' \
            dbus-run-session -- python3 tests/cinnamon_colors.py . /tmp/cinnamon-color-evidence
          python3 tests/accent_native.py cinnamon /tmp/cinnamon-color-evidence/accents
      - name: Upload Cinnamon color evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinnamon-color-rendering
          path: /tmp/cinnamon-color-evidence
          if-no-files-found: ignore

  flatpak-sandbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install sandbox fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak gnupg pax-utils gcc pkg-config libgtk-4-dev libadwaita-1-dev \
            fonts-dejavu-core gsettings-desktop-schemas xvfb xauth dbus-x11
      - name: Check signed local Flatpak runtime, actual CSS loading and per-app removal
        run: sudo --preserve-env=GITHUB_ACTIONS dbus-run-session -- xvfb-run -a python3 tests/test_flatpak_runtime.py
